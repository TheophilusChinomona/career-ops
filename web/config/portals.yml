# User-owned configuration — add/remove companies freely.
# Slugs are auto-detected from careers_url. If a board 404s or errors, it is silently skipped.
# title_filter: positive = at least one must match (case-insensitive substring); negative = any match = excluded.

title_filter:
  positive:
    - "project coordinator"
    - "project manager"
    - "junior project"
    - "project administrator"
    - "program coordinator"
    - "operations coordinator"
    - "associate project"
    - "project officer"
  negative:
    - "senior"
    - "lead"
    - "principal"
    - "staff"
    - "director"
    - "head of"
    - "vp "
    - "chief"
    - "manager, "
    - " ii"
    - " iii"

