# CareerOps — Scan boards config (web app)
#
# The "Scan boards" button reads this file and pulls live openings directly from
# each company's ATS public JSON API (Greenhouse / Ashby / Lever) — no web search,
# no LLM tokens, correct company/role/location. THIS FILE IS YOURS TO CURATE:
#   - add a company:  give its `name` + `careers_url`; the ATS slug is auto-detected
#       greenhouse → https://boards.greenhouse.io/<slug>  (or job-boards(.eu).greenhouse.io/<slug>)
#       ashby      → https://jobs.ashbyhq.com/<slug>
#       lever      → https://jobs.lever.co/<slug>
#   - remove or set `enabled: false` on ones you don't want
#   - a board that 404s or carries no matching roles is skipped silently
#
# The companies below were VERIFIED live (board exists + currently carries
# project/coordinator/operations roles) and deliberately span sectors BEYOND
# software engineering: global development / NGO, fintech, education, and
# remote-first operations — many Africa-based or remote-global.

# Which titles to keep (case-insensitive substring). Tuned for an entry-level
# project / coordination / operations professional. Edit to taste.
title_filter:
  positive:
    - "project coordinator"
    - "project manager"
    - "junior project"
    - "project officer"
    - "project administrator"
    - "program coordinator"
    - "program officer"
    - "programme coordinator"
    - "operations coordinator"
    - "operations officer"
    - "operations associate"
    - "operations analyst"
    - "operations specialist"
    - "implementation officer"
    - "implementation coordinator"
    - "administration officer"
    - "administrative coordinator"
    - "office administrator"
    - "community engagement coordinator"
    - "partnerships coordinator"
    - "logistics coordinator"
    - "delivery coordinator"
    # broader entry/mid professional titles (banking, NGO, fintech admin/ops)
    - "officer"
    - "administrator"
    - "associate"
    - "coordinator"
    - "project analyst"
  negative:
    - "senior"
    - "lead "
    - "principal"
    - "staff "
    - "director"
    - "head of"
    - "vp "
    - "vice president"
    - "chief"
    - " ii"
    - " iii"
    - "manager of"
    - "10+ years"

tracked_companies:
  # ── Global development / NGO / agriculture (often Africa-based) ──
  - name: One Acre Fund          # smallholder agriculture, East Africa
    careers_url: https://boards.greenhouse.io/oneacrefund
  - name: GiveDirectly           # cash transfers; roles incl. DRC / Africa ops
    careers_url: https://boards.greenhouse.io/givedirectly
  - name: Educate!               # youth employment — Uganda / Tanzania / Rwanda
    careers_url: https://boards.greenhouse.io/educate
  - name: Acumen                 # impact investing; partnerships / insights
    careers_url: https://boards.greenhouse.io/acumen
  - name: Wikimedia Foundation   # nonprofit; community partnerships incl. Africa
    careers_url: https://boards.greenhouse.io/wikimedia

  # ── Fintech / payments (Africa) ──
